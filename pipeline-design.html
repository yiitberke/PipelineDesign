<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="author" content="Yiğit Berke Arıkan">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boru Hattı Tasarım Programı</title>
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --soft:#f5f7f9; --ink:#14202b; --mute:#5d6b76; --line:#d5dce2;
  --acc:#1f6fb2; --acc-soft:#e3eef8; --bad:#c0392b; --ok:#2a8556; --warn:#b9770e; --vio:#6b3fc4;
  --mon:#0c1218; --mon-ink:#dbe6ee; --mon-mute:#8ea2af; --mon-pipe:#c8dce8; --mon-water:#46a0d8;
  --f:"Segoe UI",system-ui,sans-serif; --fm:Consolas,"Cascadia Mono",ui-monospace,monospace;
  --r:12px; --on-acc:#fff;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f1418; --panel:#182028; --soft:#1e2832; --ink:#e4ebf0; --mute:#98a6b0; --line:#2b3741; --acc:#6bb6e8; --acc-soft:#1d3346; --bad:#ff7163; --ok:#5ccf8f; --warn:#f0b04a; --vio:#a98bff; --on-acc:#0f1418; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0f1418; --panel:#182028; --soft:#1e2832; --ink:#e4ebf0; --mute:#98a6b0; --line:#2b3741; --acc:#6bb6e8; --acc-soft:#1d3346; --bad:#ff7163; --ok:#5ccf8f; --warn:#f0b04a; --vio:#a98bff; --on-acc:#0f1418; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f);display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 13px/1 var(--f);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:372px minmax(0,1fr);gap:14px;padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.side{overflow:auto;display:grid;gap:8px;align-content:start;padding-right:2px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
@media (max-width:980px){ html,body{height:auto} .app{grid-template-columns:minmax(0,1fr)} .side,.panel{overflow:visible} }
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.acc[open]{border-color:var(--acc)}
details.acc>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr) 14px;gap:10px;align-items:center;padding:11px 13px;border-radius:var(--r)}
details.acc>summary::-webkit-details-marker{display:none}
.num{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:600 12.5px var(--f)}
details.acc[open] .num{background:var(--acc);color:var(--panel)}
.st b{display:block;font-weight:600;font-size:14px}
.st span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
details.acc[open] .chev{transform:rotate(-135deg)}
.body{padding:4px 13px 14px;display:grid;gap:9px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center}
.fr label{font-size:13px;color:var(--mute)}
.fr.wide{grid-template-columns:minmax(0,1fr)}
input,select{font:14px var(--f);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 6px;border-radius:7px;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.hint{font-size:12px;color:var(--mute);margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child>td{border-bottom:0}
th{font-weight:600;color:var(--mute);font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini input{padding:4px 5px;text-align:right}
.mini td,.mini th{padding:4px 3px}
.mini td:first-child input{text-align:left}
.x{border:0;background:none;color:var(--mute);padding:4px 6px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:1380px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:640px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
.kpi span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font:600 17px var(--f);font-variant-numeric:tabular-nums}
.kpi i{font:400 11.5px var(--fm);color:var(--mute);font-style:normal}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;font:600 11px var(--f);color:var(--on-acc);background:var(--bad);margin-left:6px}
.badge.w{background:var(--warn)}
.panel{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding-bottom:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>h2{margin:0;padding:11px 14px 9px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.card>h2 small{font:400 12px var(--fm);color:var(--mute)}
.cb{padding:10px 14px 12px;overflow-x:auto}
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1280px){ .grid2{grid-template-columns:1fr 1fr} }
.msgs{display:grid;gap:6px}
.msg{font-size:13.5px;padding:8px 11px;border-radius:8px;border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.msg.w{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 11%,var(--panel))}
.msg.e{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.rt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font:700 12px var(--f);color:var(--on-acc);background:var(--mute)}
.rt.A{background:var(--ok)} .rt.B{background:var(--acc)} .rt.C{background:var(--warn)} .rt.D{background:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font:600 11.5px var(--f);background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.sel{background:var(--acc);color:var(--panel)} .pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok)} .pill.no{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
.simwrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1200px){ .simwrap{grid-template-columns:minmax(0,1fr) 290px} }
.monitor{background:var(--mon);border-radius:var(--r);padding:10px;color:var(--mon-ink)}
.mhead,.mfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font:400 12px var(--fm);color:var(--mon-mute);padding:2px 4px 8px}
.mfoot{padding:8px 4px 2px}
.mfoot b{color:var(--mon-ink)}
#pfd{display:block;width:100%;height:auto}
.simctl{display:grid;gap:12px;padding:12px 14px}
.sl .t{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px}
.sl output{font:400 12px var(--fm);color:var(--ink);white-space:nowrap}
input[type=range]{padding:0;border:0;accent-color:var(--acc);background:none}
.state{font-weight:700;font-size:19px}
.ch{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 14px 12px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:20px;height:0;border-top:2.4px solid;vertical-align:middle;margin-right:6px}
.steps{padding:6px 14px 14px;display:grid;gap:14px;counter-reset:s}
.step{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.step::before{content:counter(s,decimal-leading-zero);font:600 13px/1.8 var(--fm);color:var(--acc)}
.step h3{margin:0;font-size:15px}
.step p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.step .f{font:13.5px var(--fm);margin:4px 0 0;overflow-x:auto;white-space:nowrap;color:var(--ink)}
.step table{margin:6px 0}
.note{font-size:12.5px;color:var(--mute);padding:0 14px 12px;margin:0}
details.acc>summary{grid-template-columns:44px minmax(0,1fr) 14px;padding:9px 13px 9px 9px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));transition:background .2s,color .2s,transform .2s,box-shadow .2s}
.c1{--c:var(--acc)} .c2{--c:var(--vio)} .c3{--c:var(--ok)} .c4{--c:var(--warn)} .c5{--c:var(--bad)}
details.acc[open] .ico{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,var(--vio)));color:var(--panel);transform:scale(1.05);box-shadow:0 5px 14px color-mix(in srgb,var(--c) 40%,transparent)}
details.acc:hover .ico{transform:scale(1.05)}
.st b{font-size:15px}
.st span{display:none}
.seg button{display:grid;justify-items:center;gap:3px;padding:7px 6px 6px}
.sk{display:block;width:100%;height:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.sk .v{fill:var(--panel);stroke:var(--ink);stroke-width:1.6} .sk .w{fill:var(--acc);opacity:.35} .sk .p{fill:none;stroke:var(--acc);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round} .sk .a{fill:var(--acc)} .sk .d{stroke:var(--mute);stroke-width:1.2;fill:none} .sk text{font:700 12.5px var(--f);fill:var(--ink)}
.sym{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;margin-right:7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font:700 11.5px var(--f);font-style:normal}
.fi{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--soft);color:var(--acc);margin-right:7px;vertical-align:middle}
#fitT td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.sig{flex:none;text-align:center;font-size:12px;color:var(--mute);padding-block:5px 7px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--panel);letter-spacing:.02em}
.sig b{color:var(--ink);font-weight:600}
.monitor{position:relative}
#pfd{touch-action:none;user-select:none;-webkit-user-select:none}
#pfd text,#pfd .pp,#pfd #bub{pointer-events:none}
.mtools{position:absolute;top:34px;right:14px;display:flex;gap:6px;align-items:center;z-index:6}
.mtools button:not(.helpb){background:rgba(12,18,24,.88);color:#dbe6ee;border:1px solid rgba(140,170,190,.45);padding:7px 10px;font-size:12px}
.helpb{width:30px;height:30px;border-radius:50%;padding:0;font:700 16px var(--f);background:var(--acc);color:var(--on-acc);border:0;z-index:6;animation:helpPulse 2.6s ease-in-out infinite}
@keyframes helpPulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 30%,transparent)}}
.helpbox{position:absolute;inset:8px;background:rgba(8,13,18,.95);border-radius:10px;padding:16px 18px;overflow:auto;display:grid;gap:12px;align-content:start;z-index:5;color:#dbe6ee}
.helpbox h3{margin:0;font-size:16px;padding-right:44px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tip{background:rgba(140,170,190,.08);border:1px solid rgba(140,170,190,.28);border-radius:10px;padding:8px 10px}
.tip svg{height:58px;width:auto;max-width:100%;display:block;margin:0 auto}
.tip b{display:block;font-size:13.5px;margin-top:6px}
.tip span{font-size:12.5px;color:#9db0bc}
.tip .mv{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(var(--dx,0),var(--dy,-6px))}}
/* ---------- görsel efektler ---------- */
body{background:radial-gradient(1100px 520px at 88% -8%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%),radial-gradient(900px 480px at -5% 105%,color-mix(in srgb,var(--vio) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.top{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--acc),var(--vio),var(--ok),var(--acc));background-size:300% 100%;animation:slide 9s linear infinite}
@keyframes slide{to{background-position:300% 0}}
.logo{background:linear-gradient(135deg,var(--acc),var(--vio));box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 4px 22px color-mix(in srgb,var(--vio) 60%,transparent);transform:scale(1.04)}}
button{transition:transform .12s,box-shadow .15s,border-color .15s,background .15s,color .15s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
button:active:not(:disabled){transform:scale(.97)}
.tabs button:hover,.seg button:hover,.x:hover{transform:none!important;box-shadow:none!important}
.tabs button:hover{color:var(--ink)}
.seg button.on{box-shadow:0 1px 2px rgba(0,0,0,.15)!important}
button.pri{background:linear-gradient(135deg,var(--acc),var(--vio));border-color:transparent;position:relative;overflow:hidden;box-shadow:0 3px 12px color-mix(in srgb,var(--acc) 40%,transparent)}
button.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
input,select{transition:border-color .15s,box-shadow .15s}
input:not([type=range]):focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);outline:0}
details.acc{transition:border-color .2s,box-shadow .2s}
details.acc:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
details.acc[open]{box-shadow:0 6px 22px color-mix(in srgb,var(--acc) 18%,transparent)}
details.acc[open]>.body{animation:accIn .28s ease}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}}
.num{transition:background .2s,color .2s,transform .2s}
details.acc[open] .num{transform:scale(1.08);box-shadow:0 0 0 4px var(--acc-soft)}
.kpi{position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--acc),var(--vio));opacity:.75}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1);border-color:var(--acc)}
.kpi.flash{animation:kflash .7s ease}
.kpi.flash b{animation:knum .5s ease}
@keyframes kflash{0%{background:var(--acc-soft);border-color:var(--acc)}}
@keyframes knum{0%{opacity:.2;transform:translateY(5px)}}
.kpi b{display:inline-block}
.tabs button{transition:color .15s,border-color .25s}
.badge{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 22%,transparent)}}
.badge.w{animation:none}
.panel:not([hidden])>*{animation:rise .34s ease both}
.panel:not([hidden])>*:nth-child(2){animation-delay:.06s}
.panel:not([hidden])>*:nth-child(3){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card{transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 6px 22px rgba(0,0,0,.08)}
.card tr{transition:background .12s}
.card table tr:hover>td{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.pill.sel{box-shadow:0 0 0 3px var(--acc-soft)}
.msg{transition:transform .15s}
.msg:hover{transform:translateX(3px)}
.monitor{background:linear-gradient(rgba(140,170,190,.045) 1px,transparent 1px) 0 0/100% 22px,linear-gradient(90deg,rgba(140,170,190,.045) 1px,transparent 1px) 0 0/22px 100%,radial-gradient(900px 380px at 50% 0,#16222d,var(--mon));box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1px #223040}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a4a;margin-right:7px;box-shadow:0 0 8px #ff5a4a;animation:blink 1.3s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#pfd .pp circle{filter:drop-shadow(0 0 3px var(--mon-water))}
#pfd .liq{animation:liq 2.6s ease-in-out infinite;transform-box:fill-box}
@keyframes liq{50%{transform:translateY(2.5px)}}
#pfd #imp{filter:drop-shadow(0 0 4px var(--acc))}
#pfd.cav #pumpG{animation:shake .1s linear infinite}
@keyframes shake{25%{transform:translate(1.2px,-1px)}75%{transform:translate(-1.2px,1px)}}
.state{transition:color .3s}
.ch.anim polyline.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ch.anim circle{animation:pop .4s .7s ease both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}}
.side,.panel{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h7v10h11"/><circle cx="10" cy="17" r="2.6" fill="#fff"/></svg></div>
    <div><h1 data-tr="Boru Hattı Tasarımı" data-en="Pipeline Design"></h1><p data-tr="Sonuçlar doğrulanmalıdır, bu bir ön tasarım aracıdır" data-en="Results must be verified; this is a preliminary design tool"></p></div>
  </div>
  <div class="tools">
    <button id="bRef" data-tr="Referans örneği" data-en="Reference example"></button>
    <button id="bLang">English</button>
    <button id="bPdf" class="pri" data-tr="Hesap raporunu indir (PDF)" data-en="Download calculation report (PDF)"></button>
  </div>
</div>

<div class="app">

function interp(tab, x) { let i = 0; while (i < tab.length - 2 && x > tab[i + 1][0]) i++; const [x0, y0] = tab[i], [x1, y1] = tab[i + 1]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
function nomoVisc(X, Y, T) { // Şekil D-2 nomografı, cP
  const yt = interp(TSC, T), xt = 148 + (yt - 247) * 0.00977, yg = 1610 - 29.67 * Y, xg = 438 + 29.6 * X - (1610 - yg) * 0.0098;

  return Math.pow(10, (1210 - yv) / 478.5);
}
const antoine = (a, T) => 133.322 * Math.pow(10, a[0] - a[1] / (a[2] + T));

  return p1 * Math.exp(b * (1 / (t1 + 273.15) - 1 / (T + 273.15)));
}

}

function decide(fl, mid, T) {
